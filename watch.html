<script>


// =================================
// LOAD VIDEO DATA
// =================================


const params =

new URLSearchParams(

window.location.search

);



const videoId =

Number(

params.get("id")

);





const currentVideo =

getVideoById(videoId);









if(currentVideo){



// Save Watch History

saveWatchHistory(
currentVideo.id
);






document.getElementById(

"videoTitle"

).innerHTML =

currentVideo.title;







document.getElementById(

"title"

).innerHTML =

currentVideo.title;







document.getElementById(

"description"

).innerHTML =

"📝 " + currentVideo.description;







document.getElementById(

"creator"

).innerHTML =

"👤 Creator: "

+

currentVideo.creator;







document.getElementById(

"views"

).innerHTML =

"👁 Views: "

+

currentVideo.views;







document.getElementById(

"likes"

).innerHTML =

"❤️ Likes: "

+

currentVideo.likes;







document.getElementById(

"rating"

).innerHTML =

"⭐ Rating: "

+

currentVideo.rating;







document.getElementById(

"uploadDate"

).innerHTML =

"📅 Upload Date: "

+

currentVideo.uploadDate;









document.getElementById(

"videoPlayer"

).src =

currentVideo.videoLink;









if(currentVideo.isPremium){



document.getElementById(

"premium"

).innerHTML =


`

<span class="premium">

⭐ PREMIUM CONTENT

</span>

`;



}








document.getElementById(

"tags"

).innerHTML =


currentVideo.tags

.map(

tag=>"#"+tag

)

.join(" ");







loadRelatedVideos(

currentVideo.id

);





}

else{



document.querySelector(

".card"

).innerHTML =


`

<div class="empty-state">

<h2>

Video Not Found

</h2>


<p>

This video is unavailable.

</p>


</div>

`;



}




</script>

<script>


// =================================
// DOWNLOAD CHECK
// =================================


function checkDownload(){



if(!currentVideo){


alert(
"Video not available"
);


return false;


}



if(
currentVideo.downloadLink === "#"
){



alert(
"Download will be available soon."
);



return false;


}



return true;



}









// =================================
// IMPROVED SHARE
// =================================


function shareCurrentVideo(){



if(!currentVideo)

return;





const shareData = {


title:

currentVideo.title,


text:

"Watch this video on My Modern Video 🚀",


url:

window.location.href



};





if(
navigator.share
){



navigator.share(shareData);



}

else{



navigator.clipboard.writeText(

window.location.href

);



showMessage(

"Video link copied 🔗"

);



}



}









// =================================
// PAGE READY
// =================================


console.log(

"Watch Page Ready 🎬"

);



</script>
